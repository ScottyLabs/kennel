name: Prepare
description: Restore the shared build caches

runs:
  using: composite
  steps:
    - name: Cache devenv state
      uses: https://code.forgejo.org/actions/cache@v6
      with:
        path: |
          .devenv/state/deno
          .devenv/state/uv
        key: devenv-state-${{ hashFiles('**/deno.lock', '**/uv.lock') }}
        restore-keys: devenv-state-

    - name: Cache devenv eval
      uses: https://code.forgejo.org/actions/cache@v6
      with:
        path: .devenv/nix-eval-cache*
        key: devenv-eval-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix') }}
        restore-keys: devenv-eval-

    - name: Cache Rust
      uses: https://github.com/Swatinem/rust-cache@v2
      with:
        cmd-format: "devenv shell {0}"
        # Matches CARGO_TARGET_DIR from nix/modules/rust.nix
        workspaces: ". -> .devenv/state/target"
