name: CI
on:
  workflow_call:
env:
  SECRETSPEC_PROFILE: ci
  SECRETSPEC_PROVIDER: env
jobs:
  check:
    runs-on: docker
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://scottylabs.cachix.org
            extra-trusted-public-keys = scottylabs.cachix.org-1:hajjEX5SLi/Y7yYloiXTt2IOr3towcTGRhMh1vu6Tjg=
            accept-flake-config = true
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Clean stale build home
        run: rm -rf /homeless-shelter
      # .devenv/state/target is handled by Swatinem/rust-cache below
      - name: Cache devenv state
        uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: |
            .devenv/state/deno
            .devenv/state/uv
          key: devenv-state-${{ hashFiles('**/deno.lock', '**/uv.lock') }}
          restore-keys: devenv-state-
      - name: Cache devenv eval
        uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: .devenv/nix-eval-cache*
          key: devenv-eval-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix') }}
          restore-keys: devenv-eval-
      # cmd-format runs cargo metadata inside the devenv shell so that Swatinem
      # caches CARGO_TARGET_DIR=.devenv/state/target
      - name: Cache Rust
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cmd-format: "devenv shell {0}"
      - name: Clean stale build home
        run: rm -rf /homeless-shelter
      - name: Run checks
        run: devenv shell -- prek run --all-files
      - name: Run security scans
        run: |
          if ! devenv -v tasks run security > security-scan.log 2>&1; then
            cat security-scan.log
            exit 1
          fi
  build:
    runs-on: docker
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://scottylabs.cachix.org
            extra-trusted-public-keys = scottylabs.cachix.org-1:hajjEX5SLi/Y7yYloiXTt2IOr3towcTGRhMh1vu6Tjg=
            accept-flake-config = true
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Clean stale build home
        run: rm -rf /homeless-shelter
      - name: Cache devenv state
        uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: |
            .devenv/state/deno
            .devenv/state/uv
          key: devenv-state-${{ hashFiles('**/deno.lock', '**/uv.lock') }}
          restore-keys: devenv-state-
      - name: Cache devenv eval
        uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: .devenv/nix-eval-cache*
          key: devenv-eval-${{ hashFiles('devenv.lock', 'flake.lock', 'devenv.nix') }}
          restore-keys: devenv-eval-
      - name: Build
        run: |
          config=$(devenv build scottylabs.kennel.config | jq -r '."scottylabs.kennel.config"')
          packages=$(jq -r '[(.services // {} | keys[]), (.static_sites // {} | keys[])] | .[] | ".#" + .' "$config/kennel.json")
          if [ -z "$packages" ]; then
            echo "No kennel services or static sites declared; skipping build."
            exit 0
          fi
          devenv shell -- nix build $packages
