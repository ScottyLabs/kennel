[package]
name = "kennel-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
nix = { version = "0.31.2", features = ["process", "signal", "fs"] }
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socket2 = "0.6.3"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
watchexec-signals = "5.0.1"
watchexec-supervisor = "5.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.6"

[dev-dependencies]
tempfile = "3.27.0"
